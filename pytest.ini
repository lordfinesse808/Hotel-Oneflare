[pytest]
# Where pytest looks for tests
testpaths = tests
# Base URL: pages call page.goto("/rooms") and Playwright prefixes this value.
# CI can override it with:  --base-url https://other-env.example.com
base_url = https://hotel-plaza-preview.vercel.app
addopts =
    --strict-markers
    -ra
    --tracing=retain-on-failure
    --screenshot=only-on-failure
    --video=retain-on-failure
    --output=reports/artifacts
    --html=reports/report.html
    --self-contained-html
    --junitxml=reports/junit.xml
markers =
    smoke: critical-path checks; 100% must pass before merge
    functional: user-facing behaviour tests (auto-applied to tests/functional)
    non_functional: performance, accessibility, responsive, security (auto-applied)
    perf: performance budget tests
    a11y: accessibility tests
    security: transport/header checks
    responsive: viewport/layout tests
    tc(*ids): link a test to test-case IDs in the QA workbook (TC-xxx)
    defect(*ids): expected behaviour is broken by these open bugs (BUG-xxx) - runs as non-strict xfail
    live_write: creates real records on the shared site - skipped unless ALLOW_LIVE_WRITES=true
    needs_account: needs TEST_EMAIL / TEST_PASSWORD of an existing customer account
    api: HTTP-level checks without a browser page
    seo: titles, meta, robots, sitemap
    mobile: runs in a 375px mobile viewport
